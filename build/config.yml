version: '3'

info:
  companyName: ""
  productName: "语练"
  productIdentifier: "com.aling.go"
  description: "语练 - Language Learning Tool"
  copyright: ""
  comments: ""
  version: "1.0.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - build
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

frontend:
  dir: ./frontend
  install: npm install
  build: npm run build
  dev: npm run dev
  devServerUrl: http://localhost:9245
