version: "2"
sql:
  - engine: "sqlite"
    schema: "internal/store/schema.sql"
    queries: "internal/store/queries"
    gen:
      go:
        package: "userdb"
        out: "internal/store/userdb"
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          # words 表的可空列在业务层始终写入非 NULL 值，强制映射为非指针类型，
          # 避免每次读写都要做 sql.NullString/指针转换。
          - column: "words.id"
            go_type: "int"
          - column: "words.definition"
            go_type: "string"
          - column: "words.phonetic"
            go_type: "string"
          - column: "words.example"
            go_type: "string"
          - column: "words.tags"
            go_type: "string"
          - column: "words.level"
            go_type: "int"
          - column: "words.next_review"
            go_type: "string"
          - column: "words.created_at"
            go_type: "string"
          - column: "words.updated_at"
            go_type: "string"
          - column: "words.repetitions"
            go_type: "int"
          - column: "words.efactor"
            go_type: "float64"
          - column: "words.interval"
            go_type: "int"
          - column: "tags.id"
            go_type: "int"
          # 收藏表同理：业务层始终写入非 NULL 值，生成非指针字段省去转换。
          - column: "favorite_clips.id"
            go_type: "int"
          - column: "favorite_clips.text"
            go_type: "string"
          - column: "favorite_clips.tag_id"
            go_type: "int"
          - column: "favorite_clips.word"
            go_type: "string"
          - column: "favorite_clips.review_count"
            go_type: "int"
          - column: "favorite_clips.last_reviewed_at"
            go_type: "string"
          - column: "favorite_clips.next_review"
            go_type: "string"
          - column: "favorite_clips.created_at"
            go_type: "string"
          - column: "favorite_tags.id"
            go_type: "int"
          # 打字进度/记录与 AI 缓存同理，运行时始终写入非 NULL 值。
          - column: "typing_progress.article_id"
            go_type: "int"
          - column: "typing_progress.position"
            go_type: "int"
          - column: "typing_progress.completed"
            go_type: "int"
          - column: "typing_progress.best_accuracy"
            go_type: "float64"
          - column: "typing_progress.best_wpm"
            go_type: "float64"
          - column: "typing_progress.updated_at"
            go_type: "string"
          - column: "typing_records.id"
            go_type: "int"
          - column: "typing_records.article_id"
            go_type: "int"
          - column: "typing_records.accuracy"
            go_type: "float64"
          - column: "typing_records.wpm"
            go_type: "float64"
          - column: "typing_records.duration"
            go_type: "int"
          - column: "typing_records.mistakes"
            go_type: "string"
          - column: "typing_records.created_at"
            go_type: "string"
          - column: "ai_translations.kind"
            go_type: "string"
          - column: "ai_translations.model"
            go_type: "string"
          - column: "ai_translations.created_at"
            go_type: "string"
          # 订阅源与节目：运行时只写入非 NULL 值，统一映射为非指针字段。
          - column: "feeds.title"
            go_type: "string"
          - column: "feeds.description"
            go_type: "string"
          - column: "feeds.image"
            go_type: "string"
          - column: "feeds.site_url"
            go_type: "string"
          - column: "feeds.last_fetched_at"
            go_type: "string"
          - column: "feeds.last_error"
            go_type: "string"
          - column: "feeds.created_at"
            go_type: "string"
          - column: "feed_episodes.guid"
            go_type: "string"
          - column: "feed_episodes.title"
            go_type: "string"
          - column: "feed_episodes.description"
            go_type: "string"
          - column: "feed_episodes.audio_url"
            go_type: "string"
          - column: "feed_episodes.link"
            go_type: "string"
          - column: "feed_episodes.duration"
            go_type: "int"
          - column: "feed_episodes.published_at"
            go_type: "string"
          - column: "feed_episodes.local_path"
            go_type: "string"
          - column: "feed_episodes.image"
            go_type: "string"
          - column: "feed_episodes.created_at"
            go_type: "string"
