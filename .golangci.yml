# golangci-lint v2 配置
# 文档: https://golangci-lint.run/usage/configuration/
version: "2"

run:
  timeout: 5m
  tests: false

linters:
  default: standard
  enable:
    - gosec      # 安全检查
    - revive     # 代码风格（golint 继任者）
    - gocyclo    # 圈复杂度
    - misspell   # 拼写检查
  settings:
    errcheck:
      check-blank: false
      check-type-assertions: false
      # defer Close() 是 Go 惯用写法，统一忽略这些返回值
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*database/sql.Stmt).Close
        - (*database/sql.DB).Close
        - (*database/sql.Tx).Rollback
        - (*os.File).Close
        - (io.ReadCloser).Close
        - (io.Closer).Close
    gocyclo:
      min-complexity: 30
    misspell:
      locale: US
    revive:
      rules:
        - name: unreachable-code
        - name: redundant-import-alias
        - name: errorf
        - name: increment-decrement
        - name: range
        - name: receiver-naming
        - name: indent-error-flow
        - name: superfluous-else
        - name: error-return
        - name: error-naming
        - name: var-naming
        - name: package-comments
          disabled: true
    gosec:
      # 桌面应用场景下的误报排除：
      # G104 已由 errcheck 覆盖；G107/G204/G304/G703 是本地文件/子进程操作的预期行为；
      # G301/G306 为用户数据目录的常规权限；G401/G501 的 md5 仅用于缓存 key。
      excludes:
        - G104
        - G107
        - G114
        - G204
        - G301
        - G304
        - G306
        - G401
        - G501
        - G703
  exclusions:
    # npm 包内夹带的 Go 源文件（如 flatted），非项目代码，排除其问题
    paths:
      - "node_modules/"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - goimports
