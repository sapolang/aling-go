name: Bug 报告
description: 报告一个问题以帮助改进
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢花时间报告问题！请尽量填写以下信息。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰简洁地描述遇到的问题。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 如何复现该问题。
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 出现错误 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 从设置页或关于中查看的版本号。
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 如有错误日志或截图，请粘贴在此。
    validations:
      required: false
