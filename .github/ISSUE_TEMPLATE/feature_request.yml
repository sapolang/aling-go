name: 功能建议
description: 为项目提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 遇到的问题
      description: 这个功能建议是为了解决什么问题？
      placeholder: 我在使用 ... 时感到不便，因为 ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望如何解决这个问题？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过哪些替代方案？
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 其他相关的上下文、截图或参考。
    validations:
      required: false
