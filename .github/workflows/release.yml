name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

jobs:
  macos:
    runs-on: macos-latest
    env:
      # 从 git tag 提取版本号（v0.1.3 → 0.1.3），作为单一来源注入 config.yml
      APP_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Inject version into build/config.yml
        run: |
          # strip leading 'v' from tag (v0.1.3 → 0.1.3)
          VERSION="${APP_VERSION#v}"
          echo "Injecting version: $VERSION"
          sed -i.bak "s/^  version: .*$/  version: \"${VERSION}\"/" build/config.yml
          rm build/config.yml.bak
          grep "^  version:" build/config.yml
      - name: Install Wails CLI (pinned to go.mod)
        run: go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
      - run: brew install create-dmg
      - name: Cache whisper sidecar
        uses: actions/cache@v4
        with:
          path: |
            sidecar/.whisper-cpp
            sidecar/whisper-sidecar
          key: whisper-${{ runner.os }}-${{ hashFiles('sidecar/build.sh') }}
          restore-keys: |
            whisper-${{ runner.os }}-
      - name: Cache ffmpeg
        uses: actions/cache@v4
        with:
          path: sidecar/ffmpeg
          key: ffmpeg-${{ runner.os }}-8.1.2
      - run: make sidecar
      - run: make dmg
      - uses: actions/upload-artifact@v4
        with:
          name: aling-go-macos
          path: bin/aling-go.dmg

  release:
    needs: [macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate release notes
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          # 手动触发且 tag 尚未拉取时退回 HEAD，避免脚本失败
          if git rev-parse --verify "${TAG}" >/dev/null 2>&1; then REF="${TAG}"; else REF="HEAD"; fi
          PREV=$(git describe --tags --abbrev=0 "${REF}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="${PREV}..${TAG}"; else RANGE="${TAG}"; fi
          echo "Generating notes for ${RANGE} (previous tag: ${PREV:-none})"
          {
            echo "## 更新内容"
            echo
            git log --no-merges --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" "${RANGE}"
            echo
            echo
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${RANGE}"
          } > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            aling-go-macos/aling-go.dmg
          body_path: release-notes.md
          draft: ${{ github.event_name!= 'workflow_dispatch' }}
