name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

jobs:
  macos:
    runs-on: macos-latest
    env:
      # 从 git tag 提取版本号（v0.1.3 → 0.1.3），作为单一来源注入 config.yml
      APP_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Inject version into build/config.yml
        run: |
          # strip leading 'v' from tag (v0.1.3 → 0.1.3)
          VERSION="${APP_VERSION#v}"
          echo "Injecting version: $VERSION"
          sed -i.bak "s/^  version: .*$/  version: \"${VERSION}\"/" build/config.yml
          rm build/config.yml.bak
          grep "^  version:" build/config.yml
      # 缓存 wails3 二进制，避免每次从源码重编
      - name: Cache Wails CLI
        id: cache-wails
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails3
          key: ${{ runner.os }}-wails3-${{ hashFiles('go.sum') }}
      - name: Install Wails CLI (pinned to go.mod)
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
      - run: brew install create-dmg
      - name: Cache whisper sidecar
        uses: actions/cache@v4
        with:
          path: |
            sidecar/.whisper-cpp
            sidecar/whisper-sidecar
          key: whisper-${{ runner.os }}-${{ hashFiles('sidecar/build.sh') }}
          restore-keys: |
            whisper-${{ runner.os }}-
      - name: Cache ffmpeg
        uses: actions/cache@v4
        with:
          path: sidecar/ffmpeg
          key: ffmpeg-${{ runner.os }}-8.1.2
      - run: make sidecar
      # zip 依赖 dmg，同时产出 DMG（首次安装）与 zip（应用内自动更新）
      - run: make zip
      - uses: actions/upload-artifact@v4
        with:
          name: aling-go-macos
          path: |
            bin/aling-go-*.dmg
            bin/aling-go-*-darwin-*.zip
            bin/SHA256SUMS

  release:
    needs: [macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch tags
        run: git fetch --tags --force origin
      - name: Generate release notes
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          # 手动触发时 tag 可能还没推送到仓库，此时基于当前提交生成
          if git rev-parse --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            REF="${TAG}"
          else
            REF="HEAD"
            echo "::warning::tag ${TAG} 尚不存在，将基于当前提交生成说明"
          fi
          SHA=$(git rev-parse --short "${REF}")
          PREV=$(git describe --tags --abbrev=0 "${REF}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="${PREV}..${REF}"; else RANGE="${REF}"; fi
          echo "Generating notes for ${RANGE} (previous tag: ${PREV:-none})"
          {
            echo "## 更新内容"
            echo
            git log --no-merges --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" "${RANGE}"
            echo
            echo
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV:-${SHA}}...${SHA}"
          } > release-notes.md
          cat release-notes.md
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            aling-go-macos/aling-go-*.dmg
            aling-go-macos/aling-go-*-darwin-*.zip
            aling-go-macos/SHA256SUMS
          body_path: release-notes.md
          draft: ${{ github.event_name!= 'workflow_dispatch' }}
