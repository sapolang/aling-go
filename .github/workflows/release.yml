name: Release
run-name: Release ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

jobs:
  macos:
    runs-on: macos-latest
    env:
      # 从 git tag 提取版本号（v0.1.3 → 0.1.3），作为单一来源注入 config.yml
      APP_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Inject version into build/config.yml
        run: |
          # strip leading 'v' from tag (v0.1.3 → 0.1.3)
          VERSION="${APP_VERSION#v}"
          echo "Injecting version: $VERSION"
          sed -i.bak "s/^  version: .*$/  version: \"${VERSION}\"/" build/config.yml
          rm build/config.yml.bak
          grep "^  version:" build/config.yml
      # 缓存 wails3 二进制，避免每次从源码重编
      - name: Cache Wails CLI
        id: cache-wails
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/go/bin/wails3
          key: ${{ runner.os }}-wails3-${{ hashFiles('go.sum') }}
      - name: Install Wails CLI (pinned to go.mod)
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
      - run: brew install create-dmg
      - name: Cache whisper sidecar
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            sidecar/.whisper-cpp
            sidecar/whisper-sidecar
          key: whisper-${{ runner.os }}-${{ hashFiles('sidecar/versions.sh', 'sidecar/build.sh') }}
      - name: Cache ffmpeg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: sidecar/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('sidecar/versions.sh', 'sidecar/build.sh') }}
      - name: Cache yt-dlp
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: sidecar/yt-dlp
          key: yt-dlp-${{ runner.os }}-${{ hashFiles('sidecar/versions.sh', 'sidecar/build.sh') }}
      - run: make sidecar
      # zip 依赖 dmg，同时产出 DMG（首次安装）与 zip（应用内自动更新）
      - run: make zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aling-go-macos
          path: |
            bin/aling-go-*.dmg
            bin/aling-go-*-darwin-*.zip
            bin/SHA256SUMS

  windows:
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Inject version into build/config.yml
        shell: bash
        run: |
          # strip leading 'v' from tag (v0.1.3 → 0.1.3)
          VERSION="${APP_VERSION#v}"
          echo "Injecting version: $VERSION"
          sed -i.bak "s/^  version: .*$/  version: \"${VERSION}\"/" build/config.yml
          rm build/config.yml.bak
          grep "^  version:" build/config.yml
      # 缓存 wails3 二进制，避免每次从源码重编
      - name: Cache Wails CLI
        id: cache-wails
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/go/bin/wails3.exe
          key: ${{ runner.os }}-wails3-${{ hashFiles('go.sum') }}
      - name: Install Wails CLI (pinned to go.mod)
        if: steps.cache-wails.outputs.cache-hit != 'true'
        shell: bash
        run: go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
      - name: Add Go bin to PATH
        run: |
          $goBin = Join-Path (go env GOPATH) "bin"
          $goBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      # sidecar 源码缓存 + 产物缓存；key 覆盖版本文件与构建脚本，脚本变更会强制重建
      - name: Cache Windows sidecar
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            sidecar/.whisper-cpp
            sidecar/ffmpeg.exe
            sidecar/whisper-sidecar.exe
            sidecar/yt-dlp.exe
          key: windows-sidecar-${{ hashFiles('sidecar/versions.sh', 'sidecar/build-windows.sh') }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            git
            make
            curl
            xz
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
      - name: Build Windows sidecar
        shell: msys2 {0}
        run: bash sidecar/build-windows.sh
      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress
          # Chocolatey 的安装目录不会自动进入后续 Git Bash 的 PATH。
          $nsisDir = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path (Join-Path $nsisDir 'makensis.exe'))) {
            throw "makensis.exe not found in $nsisDir"
          }
          $nsisDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      # 安装程序会带上 exe、sidecar 与只读数据库；安装范围为当前用户，无需管理员权限
      - name: Build NSIS installer
        shell: bash
        run: wails3 task windows:package INSTALL_SCOPE=user APP_VERSION="${APP_VERSION#v}"
      - name: Verify installer output
        shell: bash
        run: |
          VERSION="${APP_VERSION#v}"
          INSTALLER="bin/aling-go-${VERSION}-amd64-installer.exe"
          if [ ! -f "$INSTALLER" ]; then
            echo "缺少安装包: $INSTALLER"
            ls -la bin
            exit 1
          fi
      # 应用内自动更新只接受单顶层条目的 zip，因此这里只打包 exe
      - name: Create update zip
        shell: pwsh
        run: |
          $version = "$env:APP_VERSION".TrimStart('v')
          Compress-Archive -Path "bin\aling-go.exe" -DestinationPath "bin\aling-go-$version-windows-amd64.zip" -Force
      - name: Generate checksums
        shell: bash
        run: |
          VERSION="${APP_VERSION#v}"
          cd bin
          sha256sum "aling-go-${VERSION}-amd64-installer.exe" "aling-go-${VERSION}-windows-amd64.zip" > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aling-go-windows
          path: |
            bin/aling-go-*-amd64-installer.exe
            bin/aling-go-*-windows-amd64.zip
            bin/SHA256SUMS

  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Fetch tags
        run: git fetch --tags --force origin
      - name: Generate release notes
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          # 手动触发时 tag 可能还没推送到仓库，此时基于当前提交生成
          if git rev-parse --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            REF="${TAG}"
          else
            REF="HEAD"
            echo "::warning::tag ${TAG} 尚不存在，将基于当前提交生成说明"
          fi
          SHA=$(git rev-parse --short "${REF}")
          PREV=$(git describe --tags --abbrev=0 "${REF}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="${PREV}..${REF}"; else RANGE="${REF}"; fi
          echo "Generating notes for ${RANGE} (previous tag: ${PREV:-none})"
          {
            echo "## 更新内容"
            echo
            git log --no-merges --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" "${RANGE}"
            echo
            echo
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV:-${SHA}}...${SHA}"
          } > release-notes.md
          cat release-notes.md
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      # 两个平台各自生成 SHA256SUMS，这里合并成一份，避免同名资产冲突
      - name: Merge checksums
        run: cat aling-go-macos/SHA256SUMS aling-go-windows/SHA256SUMS > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            aling-go-macos/aling-go-*.dmg
            aling-go-macos/aling-go-*-darwin-*.zip
            aling-go-windows/aling-go-*-installer.exe
            aling-go-windows/aling-go-*-windows-*.zip
            SHA256SUMS
          body_path: release-notes.md
          draft: ${{ github.event_name!= 'workflow_dispatch' }}
