name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 判断本次改动范围：纯前端改动跳过 go-checks，纯后端改动跳过 frontend-checks
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # before 为全 0（新建分支首次推送）或取不到基线时，保守起见按两边都改动处理
          if ! git diff --name-only "$base...HEAD" > /tmp/changed.txt 2>/dev/null; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat /tmp/changed.txt
          if grep -Eq '(\.go$|^go\.(mod|sum)$|^internal/store/|^\.golangci\.yml$|^Makefile$|^Taskfile\.yml$|^build/|^sidecar/|^cmd/)' /tmp/changed.txt; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^frontend/' /tmp/changed.txt; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  # 生成前端需要的 bindings（产物是 gitignored，CI 里必须现生成）
  # Wails v3 依赖 cgo / 平台 SDK，Go 相关 job 保持在 macOS（官方支持平台）
  bindings:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 缓存 wails3 二进制，避免每次从源码重编（关键路径上最慢的一段）
      - name: Cache Wails CLI
        id: cache-wails
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails3
          key: ${{ runner.os }}-wails3-${{ hashFiles('go.sum') }}

      - name: Install Wails CLI
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"

      # 与打包使用同一套参数（make bindings，含 -i），保证 CI 类型检查覆盖真实产物
      - name: Generate bindings
        run: make bindings

      # 回归保护：若误用默认 class 模式生成，可空类型会消失，CI 将漏掉打包阶段的 tsc 错误
      - name: Verify bindings are interface mode
        run: grep -q '^export interface ' frontend/bindings/aling-go/internal/study/models.ts

      - uses: actions/upload-artifact@v4
        with:
          name: wails-bindings
          path: frontend/bindings
          retention-days: 1

  # Go 侧检查，与 bindings / 前端并行；纯前端改动时跳过
  go-checks:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # main.go 有 //go:embed frontend/dist，干净 checkout 没有该目录（gitignored），
      # 先放个占位文件让 embed 匹配成功
      - name: Stub frontend/dist for go:embed
        run: mkdir -p frontend/dist && touch frontend/dist/index.html

      - name: go vet
        run: go vet ./...

      # Windows 发布链路回归：应用为纯 Go 依赖，交叉编译 main 包即可覆盖全部代码
      - name: Cross-compile Windows binary
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o "$RUNNER_TEMP/aling-go.exe" .

      # sqlc 生成代码已提交，校验其与 schema.sql / query.sql 保持同步
      - name: Cache sqlc
        id: cache-sqlc
        uses: actions/cache@v4
        with:
          path: ~/go/bin/sqlc
          key: ${{ runner.os }}-sqlc-v1.31.1

      - name: Install sqlc
        if: steps.cache-sqlc.outputs.cache-hit != 'true'
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1

      - name: Verify sqlc generated code
        run: |
          "$(go env GOPATH)/bin/sqlc" generate
          git diff --exit-code

      # 官方 action 下载预编译二进制并缓存分析结果，替代原来的 go install 编译
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0
          args: --timeout=5m

      - name: Cache govulncheck
        id: cache-govulncheck
        uses: actions/cache@v4
        with:
          path: ~/go/bin/govulncheck
          key: ${{ runner.os }}-govulncheck-latest

      - name: Install govulncheck
        if: steps.cache-govulncheck.outputs.cache-hit != 'true'
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: "$(go env GOPATH)/bin/govulncheck ./..."

      - name: go test
        run: go test ./...

  # 前端检查，需要 bindings 产物；纯后端改动时跳过
  frontend-checks:
    needs: [changes, bindings]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wails-bindings
          path: frontend/bindings

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Typecheck & build frontend
        run: npm run build
        working-directory: frontend

      - name: Frontend lint
        run: npm run lint
        working-directory: frontend

      - name: Prettier check
        run: npm run format:check
        working-directory: frontend

      - name: npm audit (production deps)
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
